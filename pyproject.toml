[project]
name = "pulse-ai-creator"
version = "0.1.0"
description = "Autonomous AI creator persona for ABTalks Vibe Code Hackathon."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.13"
]

[project.dependencies]
fastapi = "^0.111.0"
httpx = "^0.27.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
sqlalchemy = "^2.0.26"
aiosqlite = "^0.19.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.0.0"
pytest = {version = "^8.4.0", optional = true}
pytest-asyncio = {version = "^0.23.0", optional = true}

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling>=1.17.0"]
build-backend = "hatchling.build"
